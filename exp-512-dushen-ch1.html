}
.chip {

}

  10% { opacity: 1; }

  100% { transform: translateY(calc(100vh + 50px)) rotate(720deg); opacity: 0; }

// Loading screen
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 1500);
});

// Falling chips animation
const chipsContainer = document.getElementById('chipsContainer');
for (let i = 0; i < 15; i++) {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.style.left = Math.random() * 100 + '%';
  chip.style.animationDuration = (8 + Math.random() * 12) + 's';
  chip.style.animationDelay = Math.random() * 10 + 's';
  chip.style.width = chip.style.height = (20 + Math.random() * 20) + 'px';
  chipsContainer.appendChild(chip);
}

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.panel, .chapter-end').forEach(el => observer.observe(el));
