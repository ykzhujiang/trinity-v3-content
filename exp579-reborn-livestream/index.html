<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>穿越×直播×AI创业 — 第一章：重启2015</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e8e8e8;font-family:'PingFang SC','Noto Sans SC',sans-serif;overflow-x:hidden}
.panel{width:100%;max-width:500px;margin:0 auto;position:relative}
.panel img{width:100%;display:block;border-radius:0}
.panel .text{padding:16px 20px 24px;font-size:19px;line-height:1.8;letter-spacing:0.02em}
.panel .text .decision{background:linear-gradient(135deg,#1a1a2e,#16213e);border-left:4px solid #e94560;padding:14px 16px;margin:10px 0;border-radius:0 8px 8px 0;font-size:18px}
.panel .text .decision em{color:#e94560;font-style:normal;font-weight:700}
.panel .text .inner{color:#8ab4f8;font-style:italic;font-size:17px}
.chapter-title{text-align:center;padding:60px 20px 30px;font-size:28px;font-weight:700;background:linear-gradient(180deg,#e94560,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chapter-sub{text-align:center;font-size:15px;color:#888;padding-bottom:40px;letter-spacing:2px}
.cliffhanger{background:linear-gradient(180deg,#0a0a0a,#1a0a1a);padding:40px 20px;text-align:center}
.cliffhanger p{font-size:20px;line-height:2;color:#e94560;font-weight:600;margin:8px 0}
.cliffhanger .next{color:#666;font-size:15px;margin-top:20px}
.fade-in{opacity:0;transform:translateY(30px);transition:opacity 0.6s,transform 0.6s}
.fade-in.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<div class="chapter-title">第一章：重启2015</div>
<div class="chapter-sub">穿越×直播×AI创业</div>

<div id="panels"></div>

<div class="cliffhanger fade-in">
<p>2015年的字节跳动还在做今日头条……</p>
<p>他们怎么这么快就注意到我了？</p>
<p style="color:#f5a623;margin-top:16px">是有人泄露了信息？还是……</p>
<div class="next">▶ 第二章：《暗流涌动》 即将更新</div>
</div>

<script>
const panels = [
{"id":"p01","text":"那天下午，我正在调试公司的AI推荐系统。六块屏幕上跑着不同的数据流——用户画像、内容标签、实时点击率。三年了，从零到日活百万，这套系统是我最得意的作品。"},
{"id":"p02","text":"然后所有屏幕同时白了。\n\n不是死机那种黑，是刺眼的纯白。空气里传来高频的嗡鸣声，像有什么东西在共振。我下意识抬手挡脸——"},
{"id":"p03","text":"意识断裂。\n\n没有隧道，没有走马灯，只有无尽的白。我想起创业时的第一次服务器宕机——那时候我还能重启。这次，好像是我自己被重启了。"},
{"id":"p04","text":"醒来的时候，我躺在一张咯吱作响的单人床上。\n\n天花板有裂缝，墙上贴满了旧便利贴。这间屋子我认识——大学毕业后的第一间出租屋。2015年搬进来的。"},
{"id":"p05","text":"手边的手机是白色iPhone 6。我按亮屏幕，日期清清楚楚。\n\n<span class='inner'>2015年3月17日。</span>\n\n我的手开始抖。不是害怕。是一种创业者看到蓝海市场时的那种……颤栗。"},
{"id":"p06","text":"我坐在床边，双手抓着头发，用了整整三分钟消化这件事。\n\n2015年。直播元年。抖音还要等两年。快手还在三四线城市。AI推荐算法还是学术论文里的概念。\n\n而我，脑子里装着未来十一年的全部答案。"},
{"id":"p07","text":"<div class='decision'><em>📍 决策时刻</em><br>穿越后的第一反应——我没有打开电脑查股票，没有写商业计划书。我冲出门去找人。<br><br><span class='inner'>「先确认身边的人还在不在。钱的事，以后有的是时间。」</span></div>"},
{"id":"p08","text":"出门的那一刻，2015年的气息扑面而来。\n\n街上全是O2O的传单小哥，用力往行人手里塞优惠券。出租车还是扬招的。路人拿着各种奇形怪状的安卓机——屏幕小得像玩具。\n\n没有共享单车。没有刷脸支付。连4G都还不稳定。"},
{"id":"p09","text":"路过一个煎饼摊。老板一边摊煎饼一边举着手机直播，屏幕上飘着稀稀拉拉的弹幕。映客。2015年最火的直播平台之一。\n\n我嘴角不自觉地上扬。这个赛道，我太熟了。"},
{"id":"p10","text":"掏出手机看了一眼银行余额。\n\n<span class='inner'>先是苦笑——当年真穷啊。然后笑容变了味——变成了那种「我知道接下来十年每一个风口」的笑。</span>"},
{"id":"p11","text":"在网吧找到老陈的时候，他正对着招聘网站发呆。\n\n老陈，大学室友，全栈工程师，代码写得比诗好。上个月被公司裁员了。在我的记忆里，2015年的他接下来会在外包公司蹉跎三年。\n\n但这次不会了。"},
{"id":"p12","text":"「走，吃拉面。我请。」\n\n兰州拉面馆，两碗大份牛肉面。我一边嗦面一边用筷子在桌上比划。老陈听得一愣一愣的，面条从嘴角滑下来都没注意。\n\n「你说的这个……AI推荐直播内容？2015年谁会信这个？」"},
{"id":"p13","text":"<div class='decision'><em>📍 决策时刻</em><br>老陈问我怎么突然有这么完整的想法。要不要告诉他穿越的真相？<br><br><span class='inner'>不。说了他会以为我疯了。「我就说……我想了很久。」务实第一。</span></div>"},
{"id":"p14","text":"我拽过一张餐巾纸，掏出圆珠笔开始画。\n\n直播平台→内容分发→AI推荐引擎→用户行为反馈→模型迭代。2015年根本没人这么想问题，但我知道——这是2020年所有平台的标配。"},
{"id":"p15","text":"老陈推了推眼镜，盯着餐巾纸上的架构图。\n\n「你这是要做什么？比今日头条还猛？」\n\n「差不多吧。但我们先从直播切。」"},
{"id":"p16","text":"话到嘴边差点说出「短视频」三个字——2015年还没这个概念。我硬生生咽回去，改口：\n\n<span class='inner'>「这个……以后再说。」</span>\n\n老陈狐疑地看了我一眼。我赶紧低头嗦面，掩饰尴尬。"},
{"id":"p17","text":"<div class='decision'><em>📍 决策时刻</em><br>启动资金怎么来？找投资人？还是先自己做？<br><br><span class='inner'>先做MVP。产品先行。我一行代码可以抵一百页PPT。黑客精神，让产品说话。</span></div>"},
{"id":"p18","text":"回到出租屋，打开那台旧笔记本。\n\n2015年的开发环境简陋得让人想哭——但核心算法思路是我从2026年带回来的。降维打击。"},
{"id":"p19","text":"72小时。\n\n窗外从夜变成天，又从天变成夜。桌上的能量饮料罐从一个变成七个。我的黑眼圈从无到有，但屏幕上的代码越来越漂亮。"},
{"id":"p20","text":"「你看。」我把笔记本转向老陈。\n\n推荐算法跑起来了。随便导入一组用户数据，精准度吓人。老陈推了推眼镜，又推了一次，眼睛瞪得铜铃大。\n\n「你这……什么黑科技？！」\n\n<span class='inner'>我心想：这只是2020年的基础水平而已。</span>"},
{"id":"p21","text":"但麻烦来了。\n\n我在网吧演示的时候，没注意到角落里有个人在偷偷拍照。戴着帽子，手机举得不高不低——刚好能拍到我的屏幕。"},
{"id":"p22","text":"<div class='decision'><em>📍 决策时刻</em><br>发现有人抄袭了原型思路。怎么办？<br><br><span class='inner'>菩萨心肠，霹雳手段。先警告。不听？技术碾压。</span></div>"},
{"id":"p23","text":"我走过去，一只手插在兜里，另一只手指着他的手机。\n\n没说什么狠话。只是把我笔记本上的另一个算法模型打开——一个远比刚才复杂十倍的架构。\n\n「你拍到的只是表面。要不要我教你真正的核心？」\n\n他的脸白了。"},
{"id":"p24","text":"当天晚上，出租屋变成了作战室。\n\n老陈正式入伙。我在白纸上画产品路线图：第一阶段——直播内容推荐；第二阶段——主播培训体系；第三阶段——\n\n<span class='inner'>第三阶段我没说。因为那是短视频。2015年说出来会被当疯子。</span>"},
{"id":"p25","text":"我躺在床上刷着当下的直播APP。映客、花椒、一直播……界面粗糙，推荐逻辑几乎等于随机。\n\n<span class='inner'>就像一片肥沃的土地，所有人都在地表捡果子。而我，知道地下埋着金矿。</span>"},
{"id":"p26","text":"凌晨两点。手机震了一下。\n\n一封邮件。\n\n我看到发件人的瞬间，整个人定住了。血液好像瞬间冷了两度。"},
{"id":"p27","text":"「朱先生，我们注意到您最近在直播推荐算法方面的工作。想约您见面聊聊。」\n\n<span class='inner'>署名：字节跳动。张一鸣。</span>\n\n2015年的字节跳动还在做今日头条。短视频和直播是两年后的事。\n\n他怎么这么快就注意到我了？"},
{"id":"p28","text":"我站在窗前，看着2015年的城市夜景。\n\n路灯昏黄，远处有几栋写字楼还亮着灯。这座城市还不知道自己即将迎来怎样的巨变。而我站在这里，一个从未来回来的人，怀揣着改变一切的密码。\n\n<span class='inner'>但现在，有人比我预料的更早嗅到了血腥味。</span>\n\n游戏，刚刚开始。"}
];

const container = document.getElementById('panels');
panels.forEach(p => {
  const div = document.createElement('div');
  div.className = 'panel fade-in';
  div.innerHTML = `<img src="${p.id}.jpg" alt="${p.id}" loading="lazy"><div class="text">${p.text.replace(/\n/g,'<br>')}</div>`;
  container.appendChild(div);
});

const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }});
}, {threshold: 0.1});
document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
</script>

</body>
</html>
