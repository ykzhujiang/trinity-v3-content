<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朱江 — V5角色形象设定</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;padding:20px}
h1{text-align:center;font-size:28px;margin:20px 0 10px;background:linear-gradient(135deg,#ff6b35,#f7c948);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:1fr;gap:20px;max-width:500px;margin:0 auto}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #333}
.card img{width:100%;display:block}
.card .label{padding:12px 16px;font-size:16px;color:#ccc;text-align:center;font-weight:500}
.ref{text-align:center;margin:30px 0;padding:20px;background:#1a1a1a;border-radius:12px;border:1px solid #333}
.ref h2{font-size:20px;margin-bottom:15px;color:#f7c948}
.ref p{color:#aaa;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<h1>朱江 — V5角色形象设定</h1>
<p class="subtitle">漫画拟真风格 · 全角度参考图 · 待确认</p>

<div class="ref">
<h2>关键特征</h2>
<p>黑色后梳短发 · 短胡茬 · 方脸微圆润 · 下颌线明显<br>棕色眼睛 · 自信从容 · 中等偏壮体型</p>
</div>

<div class="grid">
<div class="card"><img src="01-front-portrait.jpg" alt="正面"><div class="label">① 正面 — 标准头像</div></div>
<div class="card"><img src="02-three-quarter.jpg" alt="3/4侧面"><div class="label">② 3/4侧面 — 常用角度</div></div>
<div class="card"><img src="03-side-profile.jpg" alt="侧面"><div class="label">③ 侧面轮廓</div></div>
<div class="card"><img src="04-low-angle-heroic.jpg" alt="仰视"><div class="label">④ 仰视 — 霸气/逆袭场景</div></div>
<div class="card"><img src="05-high-angle-thinking.jpg" alt="俯视"><div class="label">⑤ 俯视 — 思考/沉稳</div></div>
<div class="card"><img src="06-fullbody-casual.jpg" alt="便装全身"><div class="label">⑥ 全身便装 — 创业者日常</div></div>
<div class="card"><img src="07-fullbody-suit.jpg" alt="正装全身"><div class="label">⑦ 全身正装 — 商务场合</div></div>
</div>

<div class="ref" style="margin-top:30px">
<h2>使用说明</h2>
<p>确认后，此组图将成为所有V5内容中"虚拟朱江"的官方参考。<br>后续生图时以这些角度为基准，保持形象一致性。</p>
</div>
</body>
</html>
