<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个人的睡眠建筑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06060c;color:#d8d0c8;font-family:'Noto Serif SC',serif;font-size:20px;line-height:1.9;overflow-x:hidden}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
.intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;animation:fadeIn 2s}
.intro h1{font-size:clamp(1.8rem,5vw,2.8rem);color:#6a8ccc;margin-bottom:1rem;text-shadow:0 0 40px rgba(106,140,204,0.3)}
.intro .sub{color:#776;font-size:1.1rem;margin-bottom:2rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

.building-wrap{max-width:800px;margin:0 auto;padding:2rem 1rem}
.building-header{text-align:center;color:#665;font-size:0.9rem;margin-bottom:2rem}

.hypnogram{max-width:700px;margin:0 auto 2rem;height:80px}
.hypnogram svg{width:100%;height:100%}

.floor{
  border:1px solid #1a1a28;padding:1.2rem 1.5rem;cursor:pointer;
  transition:all 0.5s cubic-bezier(0.4,0,0.2,1);position:relative;margin-bottom:2px;
}
.floor::before{content:'';position:absolute;inset:0;background:var(--fc);opacity:0.04;transition:opacity 0.4s}
.floor:hover::before{opacity:0.12}
.floor:hover{border-color:var(--fc);transform:scale(1.01)}
.floor.active{border-color:var(--fc);background:rgba(255,255,255,0.02)}
.floor-head{display:flex;justify-content:space-between;align-items:center}
.floor-name{font-size:1.05rem;font-weight:700;color:var(--fc)}
.floor-time{font-size:0.8rem;color:#665}
.floor-meta{font-size:0.8rem;color:#554;margin-top:0.2rem}
.floor-bar{width:100%;height:4px;background:#111;border-radius:2px;margin-top:0.5rem;overflow:hidden}
.floor-bar-fill{height:100%;border-radius:2px;background:var(--fc);opacity:0.6}

.stage-wake{--fc:#cc8844}.stage-light{--fc:#7788aa}.stage-deep{--fc:#3a5599}.stage-rem{--fc:#9966bb}

.room-panel{
  display:none;max-width:750px;margin:0.5rem auto 1.5rem;padding:1.5rem 2rem;
  border-left:3px solid var(--fc);background:linear-gradient(90deg,rgba(255,255,255,0.02),transparent);
  animation:slideIn 0.5s;
}
.room-panel.active{display:block}
.room-title{font-size:1.3rem;font-weight:700;color:var(--fc);margin-bottom:0.3rem}
.room-stage{font-size:0.85rem;color:#665;font-style:italic;margin-bottom:1rem}
.room-dream{font-size:1.05rem;line-height:2;color:#ccc4b8;margin-bottom:1rem}
.room-objects{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.5rem}
.obj-btn{
  padding:0.3rem 0.8rem;border:1px solid var(--fc);border-radius:20px;
  font-size:0.85rem;color:var(--fc);cursor:pointer;transition:all 0.3s;background:transparent;
}
.obj-btn:hover{background:var(--fc);color:#06060c}
.obj-detail{display:none;padding:0.8rem 0;font-size:0.95rem;color:#998;line-height:1.8;border-top:1px solid #1a1a28;margin-top:0.5rem;animation:fadeIn 0.4s}
.obj-detail.show{display:block}

.coda{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 2rem;opacity:0;transition:opacity 1.5s}
.coda.visible{opacity:1}
.coda .big{font-size:clamp(1.6rem,4vw,2.5rem);color:#6a8ccc;font-weight:700;margin-bottom:1.5rem}
.coda .line{font-size:1.15rem;color:#887;max-width:600px;line-height:2.2}
.coda em{color:#9966bb;font-style:normal;font-weight:700}

.progress-bar{position:fixed;bottom:0;left:0;height:3px;background:#6a8ccc;transition:width 0.3s;z-index:100}
@media(max-width:600px){body{font-size:18px}}
</style>
</head>
<body>
<div class="progress-bar" id="prog"></div>

<div class="intro">
  <h1>一个人的睡眠建筑</h1>
  <p class="sub">每晚你建造一栋楼。<br>每天早上你把它拆了。<br>然后什么都不记得。</p>
  <p style="color:#554;font-size:0.85rem;margin-top:2rem">↓ 点击每一层楼，进入那个房间</p>
</div>

<div class="building-wrap">
  <div class="building-header">2026年3月16日 · 周一 · 23:11入睡 · 07:03醒来 · 共7小时52分钟 · 睡眠评分78</div>
  <div class="hypnogram"><svg viewBox="0 0 800 80" preserveAspectRatio="none">
    <text fill="#554" font-size="10" x="5" y="15">醒</text><text fill="#554" font-size="10" x="5" y="32">REM</text><text fill="#554" font-size="10" x="5" y="52">浅</text><text fill="#554" font-size="10" x="5" y="72">深</text>
    <polyline fill="none" stroke="#6a8ccc" stroke-width="2" filter="url(#glow)" points="40,50 80,65 140,70 200,65 250,30 300,50 360,70 410,65 450,30 490,50 530,45 580,30 630,50 680,65 730,30 770,15"/>
    <defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  </svg></div>
  <div id="building"></div>
</div>

<div id="roomArea"></div>

<div class="coda" id="coda">
  <div class="big" id="codaBig"></div>
  <div class="line" id="codaLine"></div>
</div>

<script>
const F=[
{name:'阁楼 · 入睡走廊',time:'23:11–23:26',stage:'wake',dur:15,pct:3,depth:'清醒→浅睡过渡',
dream:'不是房间，是走廊。两边的门上写着白天没做完的事。有一扇门上写着"明天要交的方案"，门缝下透出蓝光。你加快脚步走过去，假装没看见。',
objs:[
{n:'🚪 方案之门',d:'门把手是温热的——白天的你刚碰过。你选择不开门。这是你今天做的最后一个决定。'},
{n:'🔵 屏幕蓝光',d:'通过眼皮渗入。松果体不满地咕哝。褪黑素分泌延迟了12分钟。你不知道，但你的身体在计较。'},
{n:'🧥 白天的外套',d:'挂在走廊尽头。口袋里有一张皱巴巴的收据——午饭38元。你不记得吃了什么，但胃酸记得：pH 2.3。'}
]},
{name:'3F · 浅睡层 I',time:'23:26–23:58',stage:'light',dur:32,pct:7,depth:'N1-N2期',
dream:'房间开始变软。墙壁是海绵做的，天花板在缓慢下降——不是压迫感，是拥抱感。你试图抓住一个想法，但它像水一样从指缝流走。',
objs:[
{n:'🌊 液态想法',d:'"我是不是忘了关灯？"这个想法存在了0.3秒，然后变成一滴水落在地上。你听见了水声。或者你只是以为自己听见了。'},
{n:'🧽 海绵墙壁',d:'触感温热。它在吸收你白天的声音——开会说的话、外卖小哥的"到了"、微信提示音。全被海绵吸走了。明天这些声音就不存在了。'},
{n:'🕯️ 闪烁意识',d:'瞳孔在黑暗中放大到7mm。一种叫"入睡抽动"的东西让你的腿突然蹬了一下——大脑以为你在摔倒，发出了最后一道错误警报。'}
]},
{name:'2F · 深睡地下室 I',time:'23:58–00:47',stage:'deep',dur:49,pct:10,depth:'N3期δ波',
dream:'地下室。没有窗户，没有声音，没有梦。大脑在做碎片整理——把今天的记忆分类：保留、压缩、删除。你不在这里。你的身体在，你不在。',
objs:[
{n:'🗄️ 记忆档案柜',d:'第一个抽屉：午饭吃了什么→压缩。第二个：老板@我→保留（标记"威胁"）。第三个：地铁上一张陌生人的脸→删除。你没有权限打开第四个抽屉。'},
{n:'🧹 脑脊液清洗',d:'淋巴系统在清洗β-淀粉样蛋白。这是预防阿尔茨海默病的日常维护。每天少睡1小时，维修队就来不及清完。40年后的账单会很贵。'},
{n:'📉 最低功耗',d:'心率52。呼吸12次/分。核心体温36.1°C。你是一台只留了心跳和呼吸两个后台进程的机器。'}
]},
{name:'1F · 深睡地下室 II',time:'00:47–01:32',stage:'deep',dur:45,pct:10,depth:'最深N3',
dream:'更深的地下室。空气是固体的——你在固体的安静里悬浮。有人在你耳边说话，你听不见。地震了你可能会醒。但只是可能。',
objs:[
{n:'⬛ 虚无房间',d:'科学家说N3期没有梦。但谁知道呢——也许有梦，只是记忆在这一层没开机。就像森林里倒了一棵树但没人听到。'},
{n:'💀 最近的距离',d:'这是你全天意识最低的时刻。EEG显示δ波0.5-4Hz，和深度麻醉一样。你和"没有你"之间只差一个心跳的距离。'},
{n:'🫀 心脏独白',d:'你不在的时候心脏自言自语。它不需要你的许可就能跳。52次/分钟，每次泵出70ml血。已经这样干了三十年，从未请假。'}
]},
{name:'B1 · REM影厅 I',time:'01:32–01:54',stage:'rem',dur:22,pct:5,depth:'快速眼动期',
dream:'电影院。屏幕上放的是你的记忆remix。高中操场＋昨天的会议室＋你妈的厨房＝一个不存在的地方，你在里面同时跑步、汇报工作、吃红烧肉。',
objs:[
{n:'🎬 混剪记忆',d:'大脑在做自由联想——把毫不相关的场景拼在一起，看会不会产生新连接。梦很荒诞不是bug，是feature。'},
{n:'👁️ 快速眼球',d:'眼球在眼皮下每秒转动3-4次。你在"看"梦里的画面。撬开你的眼皮，瞳孔是散大的。'},
{n:'🔒 肌肉锁定',d:'全身肌肉被脑干锁定——"禁止运动"指令。否则你会在床上跑步。偶尔锁定失败，就是梦游。'}
]},
{name:'3F · 浅睡层 II',time:'01:54–02:38',stage:'light',dur:44,pct:9,depth:'N2期',
dream:'回到海绵房间，但装修变了。墙上多了几幅画——画的是你刚才梦里的场景，但你已经认不出来了。你觉得似曾相识。',
objs:[
{n:'🖼️ 褪色画作',d:'REM期的梦在浅睡层被"冲洗"——90%的细节在这里丢失。你醒来说"做了个梦但想不起来"，就是在这个房间发生的。'},
{n:'🌡️ 暖通循环',d:'核心体温从36.1回升到36.3°C。身体在为下一轮深睡做准备。像建筑的暖通系统在循环换气。'}
]},
{name:'2F · 深睡层 III',time:'02:38–03:15',stage:'deep',dur:37,pct:8,depth:'N3收尾',
dream:'又一次地下室，但这次更短。大脑觉得清洗工作已完成大部分，可以早点下班了。效率降了，但角落里的灰尘总能第二遍找到。',
objs:[
{n:'🧹 二次清扫',d:'第二轮深睡清洗效率是第一轮的60%。但仍然必要——打扫两遍，总能发现角落的灰。'},
{n:'💤 生长激素',d:'深睡期分泌的GH占全天75%。青少年在这里长高。成年人在这里修复肌肉。睡眠是免费的健身房。'}
]},
{name:'B2 · REM影厅 II',time:'03:15–03:52',stage:'rem',dur:37,pct:8,depth:'REM长片',
dream:'今晚最长的电影。你在一个城市里，所有路标写着你认识的人的名字。"张伟路"拐进"李明街"，走到尽头是"妈妈广场"。你想去广场，但总是拐错弯。',
objs:[
{n:'🗺️ 人名地图',d:'大脑在梳理社会关系网络。每个人名是一个节点，距离代表情感亲近度。"妈妈广场"总在最远处——不是不亲，是你太久没去了。'},
{n:'🔀 迷路',d:'大脑故意让你迷路。它在测试：走不通你怎么办？这是情绪调节训练。梦里学会面对挫败，醒来后会好过一点点。'},
{n:'😢 梦中的泪',d:'你在梦里哭了。你不知道，但眼角确实湿了。大脑在卸载情绪垃圾。有些白天不敢哭的人，只在REM期偷偷哭。'}
]},
{name:'3F · 浅睡层 III',time:'03:52–04:30',stage:'light',dur:38,pct:8,depth:'浅睡N2',
dream:'房间多了一扇窗。窗外是灰蓝色的——不是天亮了，是大脑在预演天亮。你隐约听到鸟叫，但外面没有鸟。',
objs:[
{n:'🪟 预演之窗',d:'凌晨4点，大脑增加浅睡、减少深睡。在为醒来热身——从休眠切到待机。'},
{n:'🐦 幻觉鸟鸣',d:'听觉皮层在浅睡期最活跃。你"听到"的鸟叫是神经元随机放电。但大脑很擅长把噪音编成故事。'}
]},
{name:'B3 · REM影厅 III',time:'04:30–05:18',stage:'rem',dur:48,pct:10,depth:'REM清晨场',
dream:'最长的一场。你在一个熟悉又陌生的房间里整理行李，箱子永远装不满。每放进一件东西，就有一件从另一边掉出来。你很着急，但不知道要去哪里。',
objs:[
{n:'🧳 永远装不满的箱子',d:'反复整理但永远不够——这是焦虑的经典梦境。你的大脑在处理"失控感"。白天你觉得一切都under control，但梦知道你在骗自己。'},
{n:'📍 未知目的地',d:'你急着赶路但不知道去哪里。这不是梦的bug。你的人生现在就是这个状态：很忙，但不知道在赶什么。'},
{n:'🔔 远处的闹钟',d:'你在梦里听到了一个越来越近的声音。它不属于这个房间。大脑开始怀疑：这可能不是梦。它是对的。'}
]},
{name:'3F · 浅睡层 IV',time:'05:18–06:02',stage:'light',dur:44,pct:9,depth:'浅睡N1-N2',
dream:'房间越来越亮。海绵墙在变硬，恢复成普通的墙。你开始听到真实世界的声音渗进来——隔壁的水管声，楼上的脚步声。两个世界在融合。',
objs:[
{n:'🧱 硬化的墙',d:'从海绵变回砖墙。梦的世界在收缩。再过一个小时，这个房间就不存在了。'},
{n:'🚿 水管声',d:'隔壁6点准时洗澡。这个声音穿过了你的浅睡屏障。你的大脑把它编成了梦里的瀑布。'}
]},
{name:'B4 · REM影厅 IV',time:'06:02–06:44',stage:'rem',dur:42,pct:9,depth:'最后一场REM',
dream:'散场。影厅的灯慢慢亮了。你发现座位上只有你一个人。屏幕上还在放，但画面越来越模糊。你知道电影要结束了，但你不想走。',
objs:[
{n:'💡 亮起的灯',d:'皮质醇浓度达到日间峰值。身体在催你起床。灯光越来越亮——不是电影院的灯，是你即将醒来的意识。'},
{n:'🎞️ 最后的画面',d:'你会记住的唯一一个梦。因为它离醒来最近。如果有人现在问你"昨晚做了什么梦"，你的答案就是这个房间的最后一帧。'},
{n:'🚪 出口',d:'你不想走。但灯已经亮了。这栋楼只存在了7小时52分钟，现在它要被拆除了。明天，你会在同一块地基上建一栋全新的楼。'}
]},
{name:'阁楼 · 醒来',time:'06:44–07:03',stage:'wake',dur:19,pct:4,depth:'觉醒',
dream:'你睁开了眼。天花板是白色的，不是海绵的、不是地下室的、不是电影院的。你花了3秒钟确认自己在哪里。然后闹钟响了。',
objs:[
{n:'⏰ 闹钟',d:'闹钟在07:00响。但你的身体在06:44就醒了——它比你更不想迟到。这16分钟的差距是你身体对你的不信任。'},
{n:'🏚️ 拆除通知',d:'你站起来的瞬间，这栋楼开始拆除。所有房间——海绵墙、记忆档案柜、人名地图、装不满的箱子——全部消失。到你刷牙的时候，你只记得"好像做了个梦"。'},
{n:'🌅 新的一天',d:'核心体温36.8°C，心率72BPM，皮质醇峰值。你的身体已经完全切换到白天模式。那栋楼？什么楼？'}
]}
];

const bld=document.getElementById('building');
const ra=document.getElementById('roomArea');
let explored=new Set(),total=0;
F.forEach(f=>f.objs.forEach(()=>total++));
const allNodes=F.length;

F.forEach((f,i)=>{
  // floor
  const d=document.createElement('div');
  d.className=`floor stage-${f.stage}`;
  d.innerHTML=`<div class="floor-head"><span class="floor-name">${f.name}</span><span class="floor-time">${f.time}</span></div><div class="floor-meta">${f.depth} · ${f.dur}分钟 (${f.pct}%)</div><div class="floor-bar"><div class="floor-bar-fill" style="width:${f.pct*3}%"></div></div>`;
  d.onclick=()=>toggle(i);
  bld.appendChild(d);
});

function toggle(i){
  const f=F[i];
  document.querySelectorAll('.floor').forEach(e=>e.classList.remove('active'));
  bld.children[i].classList.add('active');
  
  let p=document.getElementById('rp-'+i);
  if(!p){
    p=document.createElement('div');
    p.id='rp-'+i;
    p.className=`room-panel stage-${f.stage}`;
    let objsHtml=f.objs.map((o,j)=>`<button class="obj-btn" data-f="${i}" data-o="${j}">${o.n}</button>`).join('');
    p.innerHTML=`<div class="room-title">${f.name}</div><div class="room-stage">${f.depth} · ${f.dur}分钟</div><div class="room-dream">${f.dream}</div><div class="room-objects">${objsHtml}</div><div id="objdet-${i}"></div>`;
    ra.appendChild(p);
    p.querySelectorAll('.obj-btn').forEach(b=>{
      b.onclick=(e)=>{e.stopPropagation();showObj(i,parseInt(b.dataset.o))};
    });
  }
  
  document.querySelectorAll('.room-panel').forEach(e=>e.classList.remove('active'));
  explored.add('f'+i);
  setTimeout(()=>{p.classList.add('active');p.scrollIntoView({behavior:'smooth',block:'center'})},50);
  updateProg();
}

function showObj(fi,oi){
  const key=fi+'-'+oi;
  explored.add(key);
  const det=document.getElementById('objdet-'+fi);
  det.innerHTML=`<div class="obj-detail show">${F[fi].objs[oi].d}</div>`;
  updateProg();
  if(explored.size>=20)showCoda();
}

function updateProg(){
  document.getElementById('prog').style.width=(explored.size/(allNodes+total)*100)+'%';
}

function showCoda(){
  const c=document.getElementById('coda');
  document.getElementById('codaBig').textContent='7小时52分钟';
