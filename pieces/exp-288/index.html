<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>创业者体检报告 · 第1年 vs 第3年 vs 第5年</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0fdf4;color:#1e293b;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;line-height:1.8;overflow-x:hidden}
.container{max-width:420px;margin:0 auto;min-height:100vh}

.hospital-header{background:#fff;padding:20px;border-bottom:3px solid #16a34a}
.hospital-logo{display:flex;align-items:center;gap:10px}
.hospital-cross{width:40px;height:40px;background:#16a34a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:900}
.hospital-name{font-size:18px;font-weight:900;color:#166534}
.hospital-sub{font-size:12px;color:#6b7280}
.report-info{margin-top:16px;padding:12px;background:#f0fdf4;border-radius:8px;font-size:14px;color:#334155}
.report-info div{margin:2px 0}
.report-info strong{color:#166534}

.year-tab{display:flex;margin:16px;gap:8px}
.year-btn{flex:1;padding:12px;border-radius:12px;text-align:center;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;border:2px solid #e2e8f0;background:#fff;color:#64748b}
.year-btn.active{border-color:#16a34a;background:#16a34a;color:#fff;transform:scale(1.05)}
.year-btn .emoji{font-size:24px;display:block;margin-bottom:4px}

.report-body{padding:0 16px 16px}

.metric-card{background:#fff;border-radius:16px;margin:12px 0;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);opacity:0;transform:translateY(15px);transition:all 0.5s}
.metric-card.show{opacity:1;transform:translateY(0)}
.metric-header{display:flex;justify-content:space-between;align-items:center}
.metric-name{font-size:17px;font-weight:700}
.metric-status{font-size:13px;padding:3px 10px;border-radius:20px;font-weight:700}
.metric-status.normal{background:#f0fdf4;color:#16a34a}
.metric-status.warn{background:#fffbeb;color:#d97706}
.metric-status.danger{background:#fef2f2;color:#dc2626}
.metric-status.critical{background:#dc2626;color:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.6}}

.metric-bars{margin-top:12px}
.metric-bar-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar-label{font-size:13px;color:#64748b;width:50px;flex-shrink:0}
.bar-track{flex:1;height:20px;background:#f1f5f9;border-radius:10px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:10px;transition:width 1s ease;position:relative}
.bar-fill.green{background:linear-gradient(90deg,#22c55e,#16a34a)}
.bar-fill.yellow{background:linear-gradient(90deg,#fbbf24,#d97706)}
.bar-fill.red{background:linear-gradient(90deg,#f87171,#dc2626)}
.bar-value{font-size:13px;color:#334155;width:40px;text-align:right;flex-shrink:0;font-weight:700}

.metric-comment{margin-top:10px;padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:15px;color:#64748b;border-left:3px solid #e2e8f0;line-height:1.5}
.metric-comment.funny{border-left-color:#f59e0b;background:#fffbeb}
.metric-comment.dark{border-left-color:#dc2626;background:#fef2f2}
.metric-comment.hope{border-left-color:#16a34a;background:#f0fdf4}

.doctor-note{margin:20px 16px;padding:20px;background:linear-gradient(135deg,#1e293b,#334155);border-radius:16px;opacity:0;transform:scale(0.95);transition:all 0.6s}
.doctor-note.show{opacity:1;transform:scale(1)}
.doctor-title{font-size:16px;color:#fbbf24;font-weight:700;margin-bottom:12px}
.doctor-text{font-size:16px;color:#e2e8f0;line-height:1.8}
.doctor-sig{font-size:13px;color:#64748b;text-align:right;margin-top:12px}

.punchline{margin:16px;padding:24px;text-align:center;background:linear-gradient(135deg,#16a34a,#15803d);border-radius:16px}
.punchline-text{font-size:22px;font-weight:900;color:#fff;line-height:1.6}
.punchline-sub{font-size:14px;color:rgba(255,255,255,0.7);margin-top:8px}

.footer{text-align:center;padding:20px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="container">
  <div class="hospital-header">
    <div class="hospital-logo">
      <div class="hospital-cross">＋</div>
      <div>
        <div class="hospital-name">创业者专属体检中心</div>
        <div class="hospital-sub">Since 2020 · 专治不服</div>
      </div>
    </div>
    <div class="report-info">
      <div><strong>姓名</strong>：张明远</div>
      <div><strong>职业</strong>：创始人/CEO/产品经理/客服/保洁</div>
      <div><strong>体检类型</strong>：创业综合体检（年度对比版）</div>
    </div>
  </div>

  <div class="year-tab">
    <div class="year-btn active" onclick="switchYear(1)"><span class="emoji">😎</span>第1年</div>
    <div class="year-btn" onclick="switchYear(3)"><span class="emoji">😵</span>第3年</div>
    <div class="year-btn" onclick="switchYear(5)"><span class="emoji">🫠</span>第5年</div>
  </div>

  <div class="report-body" id="report">
    <!-- Dynamically filled -->
  </div>

  <div class="doctor-note" id="doctor">
    <div class="doctor-title">👨‍⚕️ 主治医师综合意见</div>
    <div class="doctor-text" id="doctor-text"></div>
    <div class="doctor-sig">—— 创业者体检中心 · 李医生（看过3000+创业者）</div>
  </div>

  <div class="punchline">
    <div class="punchline-text">体检报告年年变差<br>但还在体检<br>说明还活着 💪</div>
    <div class="punchline-sub">创业者最大的健康指标：还在创业</div>
  </div>

  <div class="footer">纯属虚构 · 如有雷同请立即体检</div>
</div>

<script>
const data = {
  1: {
    metrics: [
      {name:'☕ 咖啡因耐受度',status:'正常',statusClass:'normal',
       bars:[{label:'第1年',pct:30,cls:'green',val:'2杯/天'}],
       comment:'医生：目前还在正常范围。享受吧。',commentClass:'funny'},
      {name:'💇 头发密度',status:'正常',statusClass:'normal',
       bars:[{label:'第1年',pct:90,cls:'green',val:'茂密'}],
       comment:'医生：拍照留念吧，这是巅峰了。',commentClass:'funny'},
      {name:'👀 视力',status:'正常',statusClass:'normal',
       bars:[{label:'第1年',pct:85,cls:'green',val:'5.0'}],
       comment:'医生：还能看清投资人的微表情，很好。',commentClass:'funny'},
      {name:'😰 焦虑指数',status:'轻度',statusClass:'warn',
       bars:[{label:'第1年',pct:35,cls:'yellow',val:'35%'}],
       comment:'医生：这个阶段的焦虑主要来自"万一成功了怎么办"。很快你就不会有这个烦恼了。',commentClass:'funny'},
      {name:'💤 睡眠质量',status:'正常',statusClass:'normal',
       bars:[{label:'第1年',pct:75,cls:'green',val:'7h'}],
       comment:'医生：还能睡7小时？说明融资还没花完。',commentClass:'funny'},
      {name:'🍔 饮食规律性',status:'正常',statusClass:'normal',
       bars:[{label:'第1年',pct:70,cls:'green',val:'三餐'}],
       comment:'医生：一日三餐，创业者的奢侈品。',commentClass:'funny'}
    ],
    doctor:'整体状况良好！各项指标正常。建议：1）存好这份报告，以后对比用；2）少喝鸡汤多喝水；3）趁还有头发，多拍几张照片。诊断：创业初期综合征（乐观亚型）。预后：参见第3年报告。'
  },
  3: {
    metrics: [
      {name:'☕ 咖啡因耐受度',status:'超标 ↑↑',statusClass:'danger',
       bars:[{label:'第1年',pct:30,cls:'green',val:'2杯'},{label:'第3年',pct:75,cls:'red',val:'6杯/天'}],
       comment:'医生：您的血液样本送去化验，实验室问是不是送错了，以为是咖啡样本。',commentClass:'dark'},
      {name:'💇 头发密度',status:'警告 ↓↓',statusClass:'danger',
       bars:[{label:'第1年',pct:90,cls:'green',val:'茂密'},{label:'第3年',pct:45,cls:'red',val:'稀疏'}],
       comment:'医生：建议换个发型。具体来说，建议换成"不需要头发的发型"。',commentClass:'dark'},
      {name:'👀 视力',status:'下降',statusClass:'warn',
       bars:[{label:'第1年',pct:85,cls:'green',val:'5.0'},{label:'第3年',pct:55,cls:'yellow',val:'4.2'}],
       comment:'医生：好消息——看不清投资人拒绝时的表情了。',commentClass:'funny'},
      {name:'😰 焦虑指数',status:'严重超标 ↑↑↑',statusClass:'critical',
       bars:[{label:'第1年',pct:35,cls:'yellow',val:'35%'},{label:'第3年',pct:85,cls:'red',val:'85%'}],
       comment:'医生：焦虑来源已从"万一成功了"变成"这个月工资怎么发"。这属于正常进化。',commentClass:'dark'},
      {name:'💤 睡眠质量',status:'异常',statusClass:'danger',
       bars:[{label:'第1年',pct:75,cls:'green',val:'7h'},{label:'第3年',pct:30,cls:'red',val:'4h'}],
       comment:'医生：凌晨3点还在回复消息不算"夜间活动"，算工伤。',commentClass:'dark'},
      {name:'🍔 饮食规律性',status:'紊乱',statusClass:'danger',
       bars:[{label:'第1年',pct:70,cls:'green',val:'三餐'},{label:'第3年',pct:25,cls:'red',val:'外卖'}],
       comment:'医生：您的外卖APP年度报告比财务报表还详细。',commentClass:'funny'}
    ],
    doctor:'多项指标恶化，但均在"创业者正常范围"内。建议：1）不要百度搜症状，你会以为自己快死了——其实只是快没钱了；2）每周至少有一天假装自己不是CEO；3）头发已经回不来了，接受吧。诊断：创业中期综合征（燃烧亚型）。预后：参见第5年报告（如果还在的话）。'
  },
  5: {
    metrics: [
      {name:'☕ 咖啡因耐受度',status:'免疫',statusClass:'critical',
       bars:[{label:'第1年',pct:30,cls:'green',val:'2杯'},{label:'第3年',pct:75,cls:'red',val:'6杯'},{label:'第5年',pct:95,cls:'red',val:'已免疫'}],
       comment:'医生：咖啡对您已无效。建议直接静脉注射肾上腺素（开玩笑的，别真打）。',commentClass:'dark'},
      {name:'💇 头发密度',status:'接受现实',statusClass:'critical',
       bars:[{label:'第1年',pct:90,cls:'green',val:'茂密'},{label:'第3年',pct:45,cls:'yellow',val:'稀疏'},{label:'第5年',pct:15,cls:'red',val:'地中海'}],
       comment:'医生：但好消息是——现在光头是成功人士标配。您走在了潮流前面。',commentClass:'hope'},
      {name:'👀 视力',status:'佛系',statusClass:'warn',
       bars:[{label:'第1年',pct:85,cls:'green',val:'5.0'},{label:'第3年',pct:55,cls:'yellow',val:'4.2'},{label:'第5年',pct:40,cls:'yellow',val:'3.8'}],
       comment:'医生：看不清没关系，这个阶段靠直觉做决策反而更准。',commentClass:'funny'},
      {name:'😰 焦虑指数',status:'反转：下降',statusClass:'normal',
       bars:[{label:'第1年',pct:35,cls:'yellow',val:'35%'},{label:'第3年',pct:85,cls:'red',val:'85%'},{label:'第5年',pct:40,cls:'green',val:'40%'}],
       comment:'医生：不是焦虑减少了，是能让你焦虑的事都经历过了。创业者PTSD后的禅定状态。',commentClass:'hope'},
      {name:'💤 睡眠质量',status:'回升',statusClass:'warn',
       bars:[{label:'第1年',pct:75,cls:'green',val:'7h'},{label:'第3年',pct:30,cls:'red',val:'4h'},{label:'第5年',pct:55,cls:'yellow',val:'5.5h'}],
       comment:'医生：不是健康改善了，是累到大脑强制关机。但结果是好的。',commentClass:'funny'},
      {name:'🔥 抗击打能力',status:'MAX',statusClass:'normal',
       bars:[{label:'第1年',pct:20,cls:'yellow',val:'脆弱'},{label:'第3年',pct:60,cls:'yellow',val:'扛造'},{label:'第5年',pct:95,cls:'green',val:'金刚'}],
       comment:'医生：这是唯一持续上升的指标。恭喜你，你已经打不死了。',commentClass:'hope'}
    ],
    doctor:'综合诊断：创业晚期综合征（进化亚型）。身体指标全面恶化，但精神指标异常强大。你已经不是普通人类了，你是创业者——一种介于人类和不死生物之间的物种。建议：1）该体检还是要体检；2）有空就运动，没空就...算了你不会有空的；3）你已经撑到第5年了，99%的人没做到这一点。好好活着就是胜利。'
  }
};

let currentYear = 1;

function switchYear(year) {
  currentYear = year;
  document.querySelectorAll('.year-btn').forEach((btn, i) => {
    btn.classList.toggle('active', [1,3,5][i] === year);
  });
  renderReport(year);
}

function renderReport(year) {
  const d = data[year];
  const report = document.getElementById('report');
  report.innerHTML = '';
  
  d.metrics.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'metric-card';
    card.style.transitionDelay = (i * 100) + 'ms';
    
    let barsHtml = m.bars.map(b => `
      <div class="metric-bar-row">
        <span class="bar-label">${b.label}</span>
        <div class="bar-track"><div class="bar-fill ${b.cls}" style="width:0%" data-pct="${b.pct}"></div></div>
        <span class="bar-value">${b.val}</span>
      </div>
    `).join('');
    
    card.innerHTML = `
      <div class="metric-header">
        <span class="metric-name">${m.name}</span>
        <span class="metric-status ${m.statusClass}">${m.status}</span>
      </div>
      <div class="metric-bars">${barsHtml}</div>
      <div class="metric-comment ${m.commentClass}">${m.comment}</div>
    `;
    report.appendChild(card);
    
    setTimeout(() => {
      card.classList.add('show');
      card.querySelectorAll('.bar-fill').forEach(bar => {
        setTimeout(() => { bar.style.width = bar.dataset.pct + '%'; }, 300);
      });
    }, 150 + i * 120);
  });
  
  const doc = document.getElementById('doctor');
  document.getElementById('doctor-text').textContent = d.doctor;
  doc.classList.remove('show');
  setTimeout(() => doc.classList.add('show'), d.metrics.length * 120 + 400);
}

renderReport(1);
</script>
</body>
</html>
