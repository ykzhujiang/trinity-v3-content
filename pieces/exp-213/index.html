<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个月的血压小说</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0e;color:#ddd6cc;font-family:'Noto Serif SC',serif;font-size:20px;line-height:1.9;overflow-x:hidden}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;animation:fadeIn 2s}
.intro h1{font-size:clamp(1.8rem,5vw,2.8rem);color:#c25555;margin-bottom:1rem;text-shadow:0 0 40px rgba(194,85,85,0.3)}
.intro .sub{color:#776;font-size:1.1rem}

.cal-wrap{max-width:900px;margin:0 auto;padding:2rem 1rem}
.cal-header{text-align:center;color:#665;font-size:0.9rem;margin-bottom:1.5rem}
.legend{display:flex;justify-content:center;gap:1.5rem;margin-bottom:2rem;flex-wrap:wrap}
.legend span{font-size:0.8rem;color:#776;display:flex;align-items:center;gap:0.3rem}
.legend .dot{width:12px;height:12px;border-radius:2px}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:750px;margin:0 auto}
.cal-label{text-align:center;font-size:0.75rem;color:#554;padding:0.5rem 0}
.day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border:1px solid #1a1a22;border-radius:4px;transition:all 0.3s;
  position:relative;overflow:hidden;min-height:70px;
}
.day:hover{border-color:#c25555;transform:scale(1.08);z-index:2}
.day.active{border-color:#c25555;box-shadow:0 0 15px rgba(194,85,85,0.2)}
.day-num{font-size:0.75rem;color:#554;margin-bottom:0.2rem}
.day-bp{font-size:0.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.day-bar{position:absolute;bottom:0;left:0;right:0;height:4px}
.day.empty{cursor:default;border-color:transparent}
.day.empty:hover{transform:none}

/* BP color coding */
.bp-normal .day-bp{color:#5a8}
.bp-normal .day-bar{background:#5a8}
.bp-elevated .day-bp{color:#ca8}
.bp-elevated .day-bar{background:#ca8}
.bp-high .day-bp{color:#c64}
.bp-high .day-bar{background:#c64}
.bp-low .day-bp{color:#68a}
.bp-low .day-bar{background:#68a}

.story{
  display:none;max-width:750px;margin:1rem auto;padding:1.5rem 2rem;
  border-left:3px solid;animation:slideIn 0.5s;
  background:linear-gradient(90deg,rgba(255,255,255,0.02),transparent);
}
.story.active{display:block}
.story .s-date{font-size:0.85rem;color:#665;margin-bottom:0.3rem}
.story .s-bp{font-size:2.5rem;font-weight:700;margin-bottom:0.3rem}
.story .s-class{font-size:0.85rem;margin-bottom:0.8rem}
.story .s-text{font-size:1.05rem;line-height:2;color:#ccc4b8}
.story .s-note{font-size:0.85rem;color:#665;font-style:italic;margin-top:0.8rem}

.coda{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 2rem;opacity:0;transition:opacity 1.5s}
.coda.visible{opacity:1}
.coda .big{font-size:clamp(1.6rem,4vw,2.5rem);color:#c25555;font-weight:700;margin-bottom:1.5rem}
.coda .line{font-size:1.15rem;color:#887;max-width:600px;line-height:2.2}
.coda em{color:#c25555;font-style:normal;font-weight:700}

.progress-bar{position:fixed;bottom:0;left:0;height:3px;background:#c25555;transition:width 0.3s;z-index:100}
@media(max-width:600px){body{font-size:18px}.day{min-height:55px}.day-bp{font-size:0.8rem}}
</style>
</head>
<body>
<div class="progress-bar" id="prog"></div>

<div class="intro">
  <h1>一个月的血压小说</h1>
  <p class="sub">30天。60次测量。<br>每一个数字背后，都有一个他不会告诉医生的故事。</p>
  <p style="color:#554;font-size:0.85rem;margin-top:2rem">↓ 点击任意一天，读那个数字的故事</p>
</div>

<div class="cal-wrap">
  <div class="cal-header">2026年2月 · 欧姆龙上臂式血压计 · 每日晨/晚各一次</div>
  <div class="legend">
    <span><span class="dot" style="background:#68a"></span>偏低 &lt;110</span>
    <span><span class="dot" style="background:#5a8"></span>正常 110-129</span>
    <span><span class="dot" style="background:#ca8"></span>偏高 130-139</span>
    <span><span class="dot" style="background:#c64"></span>高 ≥140</span>
  </div>
  <div class="calendar" id="cal">
    <div class="cal-label">一</div><div class="cal-label">二</div><div class="cal-label">三</div><div class="cal-label">四</div><div class="cal-label">五</div><div class="cal-label">六</div><div class="cal-label">日</div>
  </div>
</div>

<div id="storyArea"></div>

<div class="coda" id="coda">
  <div class="big" id="codaBig"></div>
  <div class="line" id="codaLine"></div>
</div>

<script>
const DAYS=[
{d:1,am:'120/78',pm:'118/76',cat:'normal',border:'#5a8',
text:'第一天。新工作，新城市。他在药店买了这台血压计——不是因为身体不好，是因为妈妈说"到了新地方要注意身体"。120/78。教科书般正常。他拍了张照片发给妈妈。妈妈回复了一个"好"。',
note:'收缩压120mmHg，舒张压78mmHg。WHO标准正常范围。'},
{d:2,am:'118/75',pm:'122/80',cat:'normal',border:'#5a8',
text:'搬家第二天。下午搬了6趟纸箱上楼梯（电梯还没修好）。晚间血压122/80，比晨间高4。他以为是搬家累的。其实是新房子的味道——甲醛让他整晚没睡好，但他不知道。',
note:'运动后即时血压可升高20-30mmHg，数小时内恢复。'},
{d:3,am:'116/74',pm:'115/73',cat:'normal',border:'#5a8',
text:'周末。什么都没干。看了一天剧，吃了两顿外卖。血压全天最低。他的身体在说：你什么都不做的时候，我最舒服。',
note:'休息日血压通常低于工作日5-8mmHg。'},
{d:5,am:'125/82',pm:'128/84',cat:'normal',border:'#5a8',
text:'入职第一天。HR带他认识了20个人，没记住一个名字。全天紧绷。下午开了第一个会——他全程没说话但心率90。128/84，正常，但他觉得太阳穴在跳。',
note:'社交压力可使血压升高10-15mmHg（白大褂效应的泛化版本）。'},
{d:7,am:'130/86',pm:'126/83',cat:'elevated',border:'#ca8',
text:'第一次被mentor批评——"这个方案思路不对，重来。"他没有反驳。回到工位后手心出汗。130/86。这是他第一次看到130。他拍照发给了妈妈。妈妈说"紧张了吧，正常的"。他把照片删了。',
note:'急性心理应激可在数分钟内使收缩压升高20mmHg以上。'},
{d:8,am:'122/79',pm:'120/78',cat:'normal',border:'#5a8',
text:'方案重做了一版。mentor说"这次好多了"。他的血压立刻回到120。他发现：一句"好多了"值10个mmHg的降压效果。比任何药都快。',
note:'正向情绪反馈可快速降低交感神经张力。'},
{d:10,am:'118/76',pm:'116/74',cat:'normal',border:'#5a8',
text:'开始习惯了新工作的节奏。午饭时和同事聊了聊天。发现大家都觉得mentor很严格。他突然觉得没那么孤独了。118/76。归属感是一种降压药。',
note:'社会支持与较低的静息血压正相关（meta-analysis, n=10,000+）。'},
{d:12,am:'119/77',pm:'132/88',cat:'elevated',border:'#ca8',
text:'收到了银行的账单提醒。信用卡欠了8000多。搬家、租房押金、生活用品。他算了一下：这个月工资刚好够还。意思是——他这个月白干了。132/88。财务焦虑是一种慢性毒药。',
note:'经济压力与持续性高血压显著相关。效应量大于吸烟。'},
{d:14,am:'135/89',pm:'138/90',cat:'elevated',border:'#ca8',
text:'情人节。他给她发了条消息："节日快乐。"她回了个"你也是"。他们已经异地两个月了。135/89。他以为自己不在意，但血压计不会说谎。',
note:'孤独感可使收缩压升高10-30mmHg。情人节是单身/异地人群血压高峰日。'},
{d:15,am:'142/93',pm:'145/95',cat:'high',border:'#c64',
text:'吵架了。视频通话，她说"你是不是已经不在意了"。他说"我每天工作12个小时你让我怎么在意"。145/95。他挂了电话。血压计的数字红了。他关了灯。在黑暗里坐了40分钟。',
note:'急性情绪冲突可使收缩压瞬时超过160mmHg。15日晚间读数145/95已属1级高血压。'},
{d:16,am:'138/91',pm:'134/88',cat:'elevated',border:'#ca8',
text:'没睡好。早上血压还在138。他们没有互相发消息。他在想该不该道歉。血压在他想"道歉"的时候降了一点，想"凭什么是我道歉"的时候又升回去了。自尊心的价格是4个mmHg。',
note:'冲突后24小时内血压可持续偏高。和解预期可降低皮质醇。'},
{d:17,am:'128/84',pm:'125/82',cat:'normal',border:'#5a8',
text:'他道歉了。打了一个40分钟的电话。她哭了。他也差点哭。挂完电话量了血压：125/82。回到正常范围。他发现：说"对不起"是免费的降压药。早说早降。',
note:'情绪和解后，皮质醇和去甲肾上腺素水平在1-2小时内回到基线。'},
{d:19,am:'120/78',pm:'118/76',cat:'normal',border:'#5a8',
text:'mentor表扬了他的第二版方案。"这个方向对了。"120/78——和第一天一模一样。他的身体有一个"安全数字"：120/78。当世界对他还算温柔的时候，血压就停在这里。',
note:'正常范围的个体基线通常在±5mmHg内波动。'},
{d:21,am:'126/83',pm:'140/92',cat:'high',border:'#c64',
text:'公司体检报告出了。"转氨酶偏高，建议复查。"他没告诉任何人，但晚上的血压飙到了140。不是因为转氨酶，是因为恐惧。他打开搜索引擎输入了"转氨酶高 严重吗"。答案让他更害怕了。',
note:'健康焦虑（cyberchondria）可引发急性血压升高。Google症候群是现代人的慢性病。'},
{d:22,am:'132/87',pm:'128/84',cat:'elevated',border:'#ca8',
text:'去医院复查了。医生看了5秒钟说"没事，别熬夜别喝酒"。他松了一口气。出医院的时候，路过血压自测机——128/84。从140到128，只需要一句"没事"。',
note:'就医后焦虑缓解，血压回落。但如果医生解释不充分，反而可能加重焦虑（白大褂效应）。'},
{d:23,am:'110/70',pm:'108/68',cat:'low',border:'#68a',
text:'提了离职。不是冲动——想了一周。跟mentor说的时候，手在抖，但说完之后血压降到了全月最低：108/68。他的身体在庆祝。',
note:'长期压力源移除后，血压可在数小时内显著下降。自主性决策降低皮质醇。'},
{d:24,am:'106/66',pm:'112/72',cat:'low',border:'#68a',
text:'离职第二天。mentor找他谈了一次，问能不能留。他说不了。说完之后量了血压：112/72。他发现：说"不"比说"好"健康。',
note:'坚持自我决定的行为与更低的交感神经激活相关。'},
{d:25,am:'115/74',pm:'118/76',cat:'normal',border:'#5a8',
text:'开始交接。奇怪的是，要走了之后他反而开始认真工作了。他把文档写得很详细，比留下来的时候还认真。118/76。原来用力做不喜欢的事，和放松做不重要的事，血压是一样的。',
note:'利他行为产生的心理收益可抵消工作压力的血压升高效应。'},
{d:27,am:'122/80',pm:'120/78',cat:'normal',border:'#5a8',
text:'她说这周末飞过来看他。他的心率在看到消息的瞬间从72升到了95。但血压反而降了——120/78。兴奋和焦虑都让心跳加速，但只有焦虑升血压。身体分得清哪个是好的肾上腺素。',
note:'正向期待引起的交感激活不伴有血管收缩（与焦虑不同）。'},
{d:28,am:'116/74',pm:'114/72',cat:'normal',border:'#5a8',
text:'她来了。他去机场接的。看到她的时候，他没量血压。但他知道，那一刻是全月最健康的数字。有些血压值，血压计量不到。',
note:'拥抱时释放的催产素可在数秒内降低血压和皮质醇。'},
{d:30,am:'125/82',pm:'125/82',cat:'normal',border:'#5a8',
text:'月末。她走了。他又是一个人了。125/82。医生会说"正常偏高"。正常偏高——这也是他人生的精确描述。一切正常。偏高一点点。不至于吃药。但也不是完全OK。',
note:'125/82mmHg：收缩压正常高值，舒张压正常。不构成高血压诊断，但需要关注。'}
];

const cal=document.getElementById('cal');
const sa=document.getElementById('storyArea');
let explored=new Set();

// Feb 2026 starts on Sunday. In Mon-first grid, need 6 empty cells at start.
for(let i=0;i<6;i++){const e=document.createElement('div');e.className='day empty';cal.appendChild(e)}

const dayMap={};
DAYS.forEach(d=>dayMap[d.d]=d);

for(let i=1;i<=28;i++){
  const el=document.createElement('div');
  const d=dayMap[i];
  if(d){
    el.className=`day bp-${d.cat}`;
    el.innerHTML=`<span class="day-num">${i}</span><span class="day-bp">${d.am.split('/')[0]}</span><div class="day-bar"></div>`;
    el.onclick=()=>toggle(d.d);
  }else{
    el.className='day';
    el.innerHTML=`<span class="day-num" style="color:#333">${i}</span><span class="day-bp" style="color:#333;font-size:0.8rem">—</span>`;
    el.style.cursor='default';
    el.style.opacity='0.3';
  }
  cal.appendChild(el);
}

function toggle(day){
  const d=dayMap[day];
  explored.add(day);
  
  document.querySelectorAll('.day').forEach(e=>e.classList.remove('active'));
  // find and activate
  const days=cal.querySelectorAll('.day:not(.empty)');
  days.forEach(e=>{if(e.querySelector('.day-num')?.textContent==day)e.classList.add('active')});
  
  let p=document.getElementById('sp-'+day);
  if(!p){
    const colors={normal:'#5a8',elevated:'#ca8',high:'#c64',low:'#68a'};
    const labels={normal:'正常',elevated:'正常偏高',high:'高血压',low:'偏低'};
    p=document.createElement('div');
    p.id='sp-'+day;
    p.className='story';
    p.style.borderColor=colors[d.cat];
    p.innerHTML=`<div class="s-date">2月${d.d}日 · 晨 ${d.am} · 晚 ${d.pm}</div><div class="s-bp" style="color:${colors[d.cat]}">${d.am}</div><div class="s-class" style="color:${colors[d.cat]}">${labels[d.cat]}</div><div class="s-text">${d.text}</div><div class="s-note">${d.note}</div>`;
    sa.appendChild(p);
  }
  document.querySelectorAll('.story').forEach(e=>e.classList.remove('active'));
  setTimeout(()=>{p.classList.add('active');p.scrollIntoView({behavior:'smooth',block:'center'})},50);
  document.getElementById('prog').style.width=(explored.size/DAYS.length*100)+'%';
  if(explored.size>=18)showCoda();
}

function showCoda(){
  const c=document.getElementById('coda');
  document.getElementById('codaBig').textContent='130/85';
  document.getElementById('codaLine').innerHTML=`这是他一个月的平均血压。<br><br>医生会说：<em>正常偏高。注意饮食，少熬夜。</em><br><br>医生不会知道——<br>130是被mentor批评那天的余震。<br>85是和她吵架后第三天还没完全消退的皮质醇。<br><br>他的血压里住着：<br>一份新工作的焦虑、一笔8000块的账单、<br>一段异地恋的裂痕、一次凌晨三点的搜索引擎恐慌、<br>一封离职信带来的自由、一个拥抱带来的催产素。<br><br><em>130/85。</em><br><em>医生说正常偏高。</em><br><em>他说的是血压。</em>`;
  setTimeout(()=>{c.classList.add('visible');c.scrollIntoView({behavior:'smooth'})},500);
}
</script>
</body>
</html>
