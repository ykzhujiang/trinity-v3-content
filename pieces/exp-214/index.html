<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年的体重曲线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0e;color:#ddd6cc;font-family:'Noto Serif SC',serif;font-size:20px;line-height:1.9;overflow-x:hidden}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;animation:fadeIn 2s}
.intro h1{font-size:clamp(1.8rem,5vw,2.8rem);color:#bb7744;margin-bottom:1rem;text-shadow:0 0 40px rgba(187,119,68,0.3)}
.intro .sub{color:#776;font-size:1.1rem}

.chart-wrap{max-width:950px;margin:0 auto;padding:2rem 1rem}
.chart-header{text-align:center;color:#665;font-size:0.9rem;margin-bottom:1rem}

.curve-container{position:relative;margin:0 auto;max-width:900px;height:300px;margin-bottom:2rem}
.curve-container svg{width:100%;height:100%}
.curve-line{fill:none;stroke:#bb7744;stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(187,119,68,0.3))}
.curve-area{fill:url(#areaGrad);opacity:0.3}
.grid-line{stroke:#1a1a22;stroke-width:1}
.axis-label{fill:#554;font-size:11px}
.data-dot{fill:#bb7744;cursor:pointer;transition:r 0.3s,fill 0.3s}
.data-dot:hover{r:8;fill:#dd9955}
.phase-bg{opacity:0.05}
.month-label{fill:#554;font-size:10px;text-anchor:middle}

.nodes-wrap{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:1rem 0}
.node-btn{
  padding:0.4rem 0.8rem;border:1px solid #2a2a32;border-radius:4px;
  font-size:0.85rem;color:#887;cursor:pointer;transition:all 0.3s;background:transparent;
}
.node-btn:hover{border-color:#bb7744;color:#bb7744}
.node-btn.active{background:#bb7744;color:#0a0a0e;border-color:#bb7744}
.node-btn .kg{font-weight:700}

.story{
  display:none;max-width:750px;margin:1rem auto;padding:1.5rem 2rem;
  border-left:3px solid #bb7744;
  background:linear-gradient(90deg,rgba(187,119,68,0.04),transparent);
  animation:slideIn 0.5s;
}
.story.active{display:block}
.story .s-date{font-size:0.85rem;color:#665}
.story .s-kg{font-size:2.5rem;font-weight:700;color:#bb7744}
.story .s-delta{font-size:0.9rem;margin-bottom:0.8rem}
.s-delta .up{color:#c64}.s-delta .down{color:#5a8}.s-delta .flat{color:#887}
.story .s-text{font-size:1.05rem;line-height:2;color:#ccc4b8}

.coda{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 2rem;opacity:0;transition:opacity 1.5s}
.coda.visible{opacity:1}
.coda .big{font-size:clamp(1.6rem,4vw,2.5rem);color:#bb7744;font-weight:700;margin-bottom:1.5rem}
.coda .line{font-size:1.15rem;color:#887;max-width:600px;line-height:2.2}
.coda em{color:#bb7744;font-style:normal;font-weight:700}

.progress-bar{position:fixed;bottom:0;left:0;height:3px;background:#bb7744;transition:width 0.3s;z-index:100}
@media(max-width:600px){body{font-size:18px}.curve-container{height:200px}}
</style>
</head>
<body>
<div class="progress-bar" id="prog"></div>

<div class="intro">
  <h1>一年的体重曲线</h1>
  <p class="sub">他以为自己在称体重。<br>其实他在称一年的得失。</p>
  <p style="color:#554;font-size:0.85rem;margin-top:2rem">↓ 点击曲线上的关键节点</p>
</div>

<div class="chart-wrap">
  <div class="chart-header">2025年1月 → 2025年12月 · 体重秤数据 · 单位：kg</div>
  
  <div class="curve-container">
    <svg id="curveSvg" viewBox="0 0 900 280" preserveAspectRatio="none"></svg>
  </div>
  
  <div class="nodes-wrap" id="nodesWrap"></div>
</div>

<div id="storyArea"></div>

<div class="coda" id="coda">
  <div class="big" id="codaBig"></div>
  <div class="line" id="codaLine"></div>
</div>

<script>
const P=[
{date:'1月1日',kg:72.5,label:'元旦',phase:'warm',
text:'72.5公斤。去年的体重也是72.5。他在跨年夜站上秤，心想：至少体重没变。然后打开了她发来的跨年消息。那时候他们还在一起。',delta:'—'},
{date:'1月15日',kg:73.8,label:'年前',phase:'warm',
text:'春节前两周，公司聚餐、客户年饭、部门年会。他在15天里吃了11顿饭局。73.8。他不是在吃饭，是在完成社交任务。每顿饭平均增重0.12公斤。',delta:'+1.3'},
{date:'2月2日',kg:75.2,label:'春节',phase:'warm',
text:'在家过了7天年。妈妈每天准备8个菜。他吃完午饭还没消化就到了晚饭。75.2——春节峰值。他试图拒绝第三碗饺子，妈妈说"在外面瘦了"。这句话价值0.3公斤。',delta:'+2.7'},
{date:'2月18日',kg:74.0,label:'分手',phase:'cool',
text:'她说"我们分开吧"。那天他没吃晚饭。第二天也没吃。第三天吃了半碗面。一周降了1.2公斤。市面上所有减肥方法都不如心碎有效。74.0。他瘦了，但他宁愿胖。',delta:'-1.2'},
{date:'3月5日',kg:71.3,label:'失眠期',phase:'cool',
text:'连续两周失眠。食欲消失。71.3——全年最低。同事说"你瘦了啊，在减肥吗？"他说"对，在控制饮食"。这是他说过的最轻描淡写的谎话。',delta:'-3.9'},
{date:'3月20日',kg:72.8,label:'报复性进食',phase:'warm',
text:'某天夜里他突然饿了。点了炸鸡、奶茶、薯条、两份甜品。吃完之后躺在沙发上盯着天花板。第二天又点了。连续点了一周外卖。72.8——反弹开始。身体在用卡路里填补心里的空洞。',delta:'+1.5'},
{date:'4月10日',kg:74.5,label:'暴食期',phase:'warm',
text:'他发现自己在用吃来替代所有情绪：开心吃、难过吃、无聊吃、焦虑也吃。74.5。冰箱里永远有可乐和巧克力。他知道这不对，但停不下来。每一卡路里都是一次短暂的麻醉。',delta:'+3.2'},
{date:'5月1日',kg:73.0,label:'健身卡',phase:'cool',
text:'五一假期第一天，他办了一张健身卡。1980元/年。他在跑步机上跑了30分钟，出了一身汗。73.0。他不是为了减肥。他是为了累到可以不想她。运动是合法的逃避。',delta:'-1.5'},
{date:'6月1日',kg:70.8,label:'规律运动',phase:'cool',
text:'每周跑三次，每次5公里。70.8——第一次低于71。他在跑步的时候不听歌，只听自己的呼吸。呼-吸-呼-吸。这是他一天里最安静的30分钟。他开始喜欢出汗的感觉——像是把什么东西排出体外。',delta:'-3.7'},
{date:'6月20日',kg:69.5,label:'新低',phase:'cool',
text:'69.5。大学毕业以来的最轻体重。他拍了张秤的照片，差点发朋友圈。最后没发。因为他知道——他能到69.5，不是因为自律，是因为心碎了4个月还没完全好。瘦不是成就。瘦是副作用。',delta:'-5.7'},
{date:'7月15日',kg:70.2,label:'聚餐',phase:'warm',
text:'大学同学聚会。有人说"你是不是瘦了很多？看起来精神了"。他笑了笑。70.2。精神了？他只是把脂肪换成了失眠和跑步。但他承认——被人说"瘦了"的感觉确实不错。',delta:'+0.7'},
{date:'8月1日',kg:71.5,label:'夏天',phase:'warm',
text:'天太热，跑不动了。改成了游泳。但游泳让他更饿。71.5。夏天的体重总是比春天高一点——不是因为懒，是因为冰淇淋、冰可乐、冰啤酒。液体卡路里是最危险的，因为你喝的时候不觉得在吃东西。',delta:'+2.0'},
{date:'8月20日',kg:72.0,label:'新工作',phase:'warm',
text:'跳槽了。新公司在CBD，楼下有7家奶茶店。他的体重和奶茶店的密度成正比。72.0。每天下午三点，同事群里会有人问"谁要带奶茶"。他从未拒绝过。',delta:'+2.5'},
{date:'9月10日',kg:71.0,label:'体检报告',phase:'cool',
text:'体检报告出了。"轻度脂肪肝。建议控制饮食，增加运动。"71.0。他被一张A4纸吓瘦了1公斤。但更大的触动是——报告上"紧急联系人"那栏，他填的还是她的名字。',delta:'-1.0'},
{date:'10月1日',kg:70.5,label:'国庆',phase:'cool',
text:'国庆没回家。一个人在出租屋里呆了7天。自己做饭——番茄炒蛋、煮面、蒸鸡蛋。70.5。他发现自己做的饭永远不够一个人吃。总是做多了。习惯性地做两人份。',delta:'-1.5'},
{date:'10月20日',kg:70.8,label:'相亲',phase:'warm',
text:'妈妈安排了一次相亲。他穿了件显瘦的衬衫。70.8。吃了顿火锅，聊了两个小时。对方很好，但他在整顿饭里想了三次她。回家后他没有再联系对方。他不是不想开始，是还没结束。',delta:'+0.3'},
{date:'11月11日',kg:71.2,label:'双十一',phase:'warm',
text:'购物车里有一台跑步机。¥2599。他犹豫了三天，最后买了。还买了蛋白粉、弹力带、瑜伽垫。¥3200的"自我改变套餐"。71.2。他用消费来制造"我在变好"的幻觉。跑步机到了之后用了两周就变成了晾衣架。',delta:'+0.7'},
{date:'11月25日',kg:72.0,label:'入冬',phase:'warm',
text:'天冷了。不想出门跑步，健身卡三周没刷。火锅、烤肉、羊蝎子。冬天的体重曲线和被子的厚度同步上升。72.0。他穿上了去年的大衣——刚好。和去年一样。',delta:'+1.5'},
{date:'12月20日',kg:72.3,label:'年终',phase:'warm',
text:'年终总结的时候他算了一笔账：今年花在健身上¥5180，花在外卖上¥18240，花在奶茶上¥2880。运动/食物的投入比是1:4。72.3。他的体重和银行卡余额一起进入了盘整期。',delta:'+1.8'},
{date:'12月31日',kg:72.5,label:'跨年',phase:'warm',
text:'跨年夜。他又站上了秤。72.5。和1月1日一模一样。一整年，增减8公斤，最后回到原点。他的身体画了一个完美的圆。但站在秤上的那个人，已经不是同一个人了。',delta:'±0'}
];

// Build SVG curve
const svg=document.getElementById('curveSvg');
const minKg=68,maxKg=76,W=900,H=280,pad={l:45,r:20,t:20,b:35};
const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;

function x(i){return pad.l+(i/(P.length-1))*cw}
function y(kg){return pad.t+ch-(kg-minKg)/(maxKg-minKg)*ch}

// Grid
let gridHtml='';
for(let kg=68;kg<=76;kg+=2){
  gridHtml+=`<line class="grid-line" x1="${pad.l}" y1="${y(kg)}" x2="${W-pad.r}" y2="${y(kg)}"/>`;
  gridHtml+=`<text class="axis-label" x="${pad.l-8}" y="${y(kg)+4}" text-anchor="end">${kg}</text>`;
}
// Month labels
const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
months.forEach((m,i)=>{
  const mx=pad.l+(i/11)*cw;
  gridHtml+=`<text class="month-label" x="${mx}" y="${H-5}">${m}</text>`;
});

// Phase backgrounds
const phases=[{start:0,end:3,color:'#bb7744'},{start:3,end:5,color:'#5577aa'},{start:5,end:7,color:'#bb7744'},
{start:7,end:9,color:'#5577aa'},{start:9,end:11,color:'#bb7744'},{start:11,end:14,color:'#5577aa'},
{start:14,end:P.length-1,color:'#bb7744'}];

// Area + line
const pts=P.map((p,i)=>`${x(i)},${y(p.kg)}`);
const areaPath=`M${pts[0]} ${pts.join(' L')} L${x(P.length-1)},${H-pad.b} L${pad.l},${H-pad.b} Z`;
const linePath=pts.join(' ');

gridHtml+=`<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bb7744" stop-opacity="0.3"/><stop offset="100%" stop-color="#bb7744" stop-opacity="0"/></linearGradient></defs>`;
gridHtml+=`<path class="curve-area" d="${areaPath}"/>`;
gridHtml+=`<polyline class="curve-line" points="${linePath}"/>`;

P.forEach((p,i)=>{
  gridHtml+=`<circle class="data-dot" cx="${x(i)}" cy="${y(p.kg)}" r="5" data-idx="${i}"/>`;
});

svg.innerHTML=gridHtml;

// Nodes buttons
const nw=document.getElementById('nodesWrap');
P.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='node-btn';
  b.innerHTML=`${p.label} <span class="kg">${p.kg}</span>`;
  b.onclick=()=>toggle(i);
  nw.appendChild(b);
});

// Click dots
document.querySelectorAll('.data-dot').forEach(d=>{
  d.addEventListener('click',()=>toggle(parseInt(d.dataset.idx)));
});

const sa=document.getElementById('storyArea');
let explored=new Set();

function toggle(i){
  const p=P[i];
  explored.add(i);
  
  document.querySelectorAll('.node-btn').forEach(b=>b.classList.remove('active'));
  nw.children[i].classList.add('active');
  
  let s=document.getElementById('sp-'+i);
  if(!s){
    const deltaClass=p.delta.startsWith('+')?'up':p.delta.startsWith('-')?'down':'flat';
    s=document.createElement('div');
    s.id='sp-'+i;
    s.className='story';
    s.innerHTML=`<div class="s-date">${p.date} · ${p.label}</div><div class="s-kg">${p.kg} kg</div><div class="s-delta"><span class="${deltaClass}">较年初 ${p.delta} kg</span></div><div class="s-text">${p.text}</div>`;
    sa.appendChild(s);
  }
  document.querySelectorAll('.story').forEach(e=>e.classList.remove('active'));
  setTimeout(()=>{s.classList.add('active');s.scrollIntoView({behavior:'smooth',block:'center'})},50);
  document.getElementById('prog').style.width=(explored.size/P.length*100)+'%';
  if(explored.size>=15)showCoda();
}

function showCoda(){
  const c=document.getElementById('coda');
  document.getElementById('codaBig').textContent='72.5 → 72.5';
  document.getElementById('codaLine').innerHTML=`一年。<br>最重 <em>75.2</em>，春节，妈妈的第三碗饺子。<br>最轻 <em>69.5</em>，六月，心碎的副作用。<br><br>中间经过了：<br>一次分手（-3.9kg）<br>一次报复性进食（+3.2kg）<br>一张健身卡（-3.7kg）<br>一份体检报告（-1.0kg）<br>一台变成晾衣架的跑步机（+0.7kg）<br><br>最后的数字和年初一样。<br><br><em>你以为你在称体重。<br>其实你在称一年的得失。<br>最后那个数字和年初一样，<br>但你已经不是同一个人了。</em>`;
  setTimeout(()=>{c.classList.add('visible');c.scrollIntoView({behavior:'smooth'})},500);
}
</script>
</body>
</html>
